<style>
/* Layout: one phone-width column of chunky sticker cards with hard outlines and offset shadows, five-tab floating bar, bottom sheets. Night-arcade ink with lime for progress, hot pink for streaks, sun yellow for XP, cyan for water. */
:root{
 --bg:#150F33;--surface:#221A4D;--surface2:#2E2468;--ink:#F8F4FF;--muted:#B3A9E6;--edge:#07041C;--line:#3D3380;

}

:root[data-theme="light"]{--bg:#EEE8FF;--surface:#FFFFFF;--surface2:#F3EEFF;--ink:#1B1347;--muted:#5F55A6;--edge:#1B1347;--line:#CFC4F7;--accent:#6B2FF5;--on-accent:#FFFFFF;--pop:#E8197D;--on-pop:#FFFFFF;--gold:#FFC93C;--on-gold:#2A1B00;--cyan:#12B7D6;--on-cyan:#00232B;--chili:#E4472A;--glow1:rgba(232,25,125,.14);--glow2:rgba(18,183,214,.14);color-scheme:light}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}

.left{font-size:13.5px}.left b{font:800 22px var(--display)}

.drops{display:flex;gap:7px;flex-wrap:wrap}

/* meals */

.slotname{font:800 12.5px var(--display);letter-spacing:.08em;text-transform:uppercase;color:var(--on-pop);background:var(--pop);border:2px solid var(--edge);border-radius:99px;padding:0 10px}
.cheatc{background:linear-gradient(160deg,var(--surface),var(--surface2))}.cheatc.meal .slotname{background:var(--gold);color:var(--on-gold)}

.bd .ic{width:26px;height:26px}
.prog{height:16px;border-radius:99px;background:var(--surface2);border:2.5px solid var(--edge);overflow:hidden}.prog i{display:block;height:100%;background:var(--accent);border-right:2.5px solid var(--edge)}
.stat{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.stat div{background:var(--surface);border:2.5px solid var(--edge);border-radius:18px;padding:10px 12px;box-shadow:0 4px 0 var(--edge)}

.stat b{display:block;font:800 28px var(--display);line-height:1.1}.stat span{font-size:12.5px;font-weight:600;opacity:.85}
.card .stat div{box-shadow:0 3px 0 var(--edge)}

.field{display:flex;flex-direction:column;gap:5px;font:700 14.5px var(--display)}

.seg{display:flex;gap:8px;flex-wrap:wrap}.seg .chip{flex:1;text-align:center;min-width:80px}
.opt{display:block;width:100%;text-align:left;border:2.5px solid var(--edge);background:var(--surface);border-radius:18px;padding:11px 14px;box-shadow:0 4px 0 var(--edge)}

.opt.on{background:var(--accent);color:var(--on-accent)}.opt.on small{color:var(--on-accent);opacity:.8}

.frow:active{transform:translateY(3px);box-shadow:none}
.frow span{min-width:0}.frow b{font:700 16px var(--display)}.frow small{display:block}.frow em{font:800 15px var(--display);font-style:normal;white-space:nowrap;background:var(--gold);color:var(--on-gold);border:2px solid var(--edge);border-radius:99px;padding:0 9px}
.stepper{display:flex;align-items:center;gap:16px;justify-content:center}.stepper button{width:52px;height:52px;border-radius:16px;border:2.5px solid var(--edge);background:var(--accent);color:var(--on-accent);font:800 28px var(--display);box-shadow:0 4px 0 var(--edge)}.stepper button:active{transform:translateY(4px);box-shadow:none}.stepper b{font:800 38px var(--display);min-width:64px;text-align:center}

nav{position:fixed;left:0;right:0;bottom:0;z-index:30;padding:0 max(14px,env(safe-area-inset-right,0px)) calc(10px + env(safe-area-inset-bottom,0px)) max(14px,env(safe-area-inset-left,0px));pointer-events:none}

.pgrid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:10px}

const CHEAT=id=>CHEATS.find(c=>c.id===id);

function rng(seed){let s=(seed>>>0)||1;return()=>{s=(Math.imul(s,1664525)+1013904223)>>>0;return s/4294967296;};}
function shuffle(a,r){a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(r()*(i+1));const t=a[i];a[i]=a[j];a[j]=t;}return a;}
const snap=(x,st)=>Math.max(st,Math.round(x/st)*st);
const LOCK=new Set(['tea','chaas','salad','raita','banana','apple','guava','papaya','curd','milk']);
function scaleOpt(opt,desired){const base=itemsMacro(opt.items).k;const s=desired/base;return opt.items.map(a=>[a[0],LOCK.has(a[0])?a[1]:snap(a[1]*s,FD[a[0]].step)]);}
function dayTotal(slots){let k=0,p=0,c=0,f=0,fi=0;for(const s in slots){const x=slots[s];k+=x.k;p+=x.p;c+=x.c;f+=x.f;fi+=(x.fi||0);}return{k:Math.round(k),p:Math.round(p),c:Math.round(c),f:Math.round(f),fi:Math.round(fi)};}
function planDay(target,picks,cheat){
  const share={b:.25,m:.08,l:.32,e:.10,d:.25};
  let rem=target,slots=SLOTS.map(s=>s[0]);const out={};
  if(cheat){out[cheat.slot]={cheat:true,name:cheat.name,items:cheat.items.map(x=>x.slice())};const ck=itemsMacro(cheat.items).k;slots=slots.filter(s=>s!==cheat.slot);rem=Math.max(target-ck,target*0.4);}
  const tot=slots.reduce((a,s)=>a+share[s],0);
  for(const s of slots){const o=picks[s];out[s]={opt:o.id,name:o.name,items:scaleOpt(o,rem*share[s]/tot),base:o.items.map(x=>x[1])};}
  const adj=[];for(const s of slots)out[s].items.forEach((it,i)=>{if(!LOCK.has(it[0]))adj.push([s,i]);});
  const total=()=>{let t=0;for(const s in out)t+=itemsMacro(out[s].items).k;return t;};
  for(let n=0;n<60;n++){
    const diff=target-total();let best=null,be=Math.abs(diff);
    for(const a of adj){const it=out[a[0]].items[a[1]],f=FD[it[0]],bq=out[a[0]].base?out[a[0]].base[a[1]]:it[1];
      for(const dir of[1,-1]){const nq=it[1]+dir*f.step;if(nq<f.step-1e-9||nq>Math.max(bq*2.5,bq+2))continue;const err=Math.abs(diff-dir*f.step*f.k);if(err<be-1e-9){be=err;best=[a[0],a[1],nq];}}}
    if(!best)break;out[best[0]].items[best[1]][1]=best[2];
  }
  for(const s in out){delete out[s].base;Object.assign(out[s],itemsMacro(out[s].items));}
  return{slots:out,cheat:!!cheat,total:dayTotal(out)};
}
function buildWeek(target,prefs,seed){
  const r=rng(seed),decks={};
  for(const sl of SLOTS){const s=sl[0];let pool=OPTS.filter(o=>o.slot===s&&!(prefs.jain&&o.nj));pool=shuffle(pool,r);
    const sc=o=>(prefs.style==='gu'&&o.g?2:0)+(prefs.hp&&o.hp?1:0);pool.sort((a,b)=>sc(b)-sc(a));decks[s]=pool;}
  const idx={b:0,m:0,l:0,e:0,d:0},days=[];
  for(let d=0;d<7;d++){
    const fams=new Set(),picks={};
    for(const sl of SLOTS){const s=sl[0],deck=decks[s];let pick=null;
      for(let t=0;t<deck.length;t++){const o=deck[(idx[s]+t)%deck.length];if(!fams.has(o.fam)){pick=o;idx[s]=idx[s]+t+1;break;}}
      if(!pick){pick=deck[idx[s]%deck.length];idx[s]++;}
      fams.add(pick.fam);picks[s]=pick;}
    const ch=(prefs.cheatDay===d&&prefs.cheatId)?CHEAT(prefs.cheatId):null;
    days.push(planDay(target,picks,ch?{slot:ch.slot,name:ch.name,items:ch.items}:null));
  }
  return days;
}
function swapOpt(day,slot,optId){
  const cur=day.slots[slot],o=OPT(optId),items=scaleOpt(o,cur.k);
  day.slots[slot]=Object.assign({opt:o.id,name:o.name,items},itemsMacro(items));day.total=dayTotal(day.slots);
}

stimates from typical recipes (milk, sugar, ice cream, bread, fillings). Expect 25% or more error.", "al": "ccd cafe coffee day"}, "Amul": {"note": "Amul's shop pages publish calories and protein per pack for High Protein products, but carbs and fat are in images that could not be read, so those are estimated. Items tagged Estimated use FSSAI milk composition standards or typical label values. Check the pack.", "al": "amul"}, "Havmor": {"note": "Havmor India product page (official), per 125 ml serving.", "al": "havmor"}};

  const add=(id,part,over)=>{const e=EX[id],p=over||presc(e,W);items.push({ex:id,part,sets:p.sets,amt:p.amt,u:p.u,done:false});};
  if(type==='recovery'){
    add('sn','warm',{sets:1,amt:8,u:'rounds'});
    ['catcow','cobra','hipflex','child','hamstr'].forEach(id=>add(id,'main',{sets:1,amt:40,u:'sec'}));
  }else{
    if(W.equip==='gym'){add('tread','warm',{sets:1,amt:5,u:'min'});used.add('tread');}else{add('sn','warm',{sets:1,amt:3,u:'rounds'});used.add('sn');}
    for(const pat of SESS[type]){const e=pickEx(pat,clamp(W.lv[pat],0,5),used,W,k*3+items.length);if(!e)continue;used.add(e.id);add(e.id,'main');}
    if(W.body==='endo'&&type!=='cardio'){const e=pickEx('cardio',clamp(W.lv.cardio,0,5),used,W,k);if(e){used.add(e.id);add(e.id,'main');}}
    add('child','cool',{sets:1,amt:30,u:'sec'});add('hamstr','cool',{sets:1,amt:30,u:'sec'});
  }
  return Object.assign({rest:false,type,name:SNAME[type],focus:SFOCUS[type],items},estSession(items,weight));
}
function buildWorkout(W,weight){
  const n=W.days,map=DAYMAP[n],tpl=TEMPL[n].slice(),week=[];
  for(let i=0;i<7;i++)week.push({rest:true});
  map.forEach((di,k)=>{let t=tpl[k];if(W.body==='ecto'&&t==='cardio')t='glutecore';week[di]=mkSession(t,k,W,weight);});
  return week;
}
function initLv(fit){const v={beginner:1,intermediate:2.2,advanced:3.4}[fit]||1;return{push:v,pull:v,shoulder:v,tri:v,bi:v,squat:v,hinge:v,calf:v,core:v,cardio:v};}
function adaptW(W,rating,pain){
  for(const k in W.lv){
    if(rating==='easy')W.lv[k]=Math.min(5,W.lv[k]+1);
    else if(rating==='right')W.lv[k]=Math.min(5,W.lv[k]+0.4);
    else W.lv[k]=Math.max(0,W.lv[k]-0.8);
  }
  if(rating==='easy'){W.repBonus=0;W.setAdj=Math.min(1,(W.setAdj||0)+1);}
  else if(rating==='right'){W.repBonus=Math.min(4,(W.repBonus||0)+1);}
  else{W.repBonus=Math.max(0,(W.repBonus||0)-2);W.setAdj=-1;}
  if(pain)W.lowImpact=true;
}

function navyFat(){
  const p=S.profile,n=lastOf('neck'),w=lastOf('waist'),hp=lastOf('hip'),h=+p.h;let r=null;
  if(n==null||w==null||w<=n)return null;

  else msg='You are inside the healthy range. Keep your weight steady.';
  let gm;
  if(gb<18.5)gm='Your goal of '+tw+' kg is below the healthy range. Consider a higher goal.';
  else if(gb<23)gm='Your goal of '+tw+' kg is inside the healthy range.';
  else gm='Your goal of '+tw+' kg is BMI '+gb.toFixed(1)+' ('+bmiCat(gb)+'). That is a good first milestone, and you can aim lower once you reach it.';
  const rows=[['Underweight','Below '+hm+' kg','--cyan'],['Healthy',hm+' to '+hx+' kg','--accent'],['Overweight',hx+' to '+t.w25+' kg','--gold'],['Obese',t.w25+' kg and above','--chili']];
  let h='<section class="card"><h2>Ideal weight and BMI</h2><p class="muted" style="margin:4px 0 8px">At '+p.h+' cm, a healthy weight is <b>'+hm+' to '+hx+' kg</b> (BMI 18.5 to 22.9). Your ideal is about <b>'+t.ideal+' kg</b>, the middle of that range.</p>'+bmiScale(bmi)+'<div style="margin-top:6px">';
  for(const r of rows)h+='<div class="band"><i style="background:var('+r[2]+')"></i><span style="flex:1;font-weight:'+(r[0]===cat?'800':'500')+'">'+r[0]+'</span><span>'+r[1]+'</span>'+(r[0]===cat?'<span class="pill">You</span>':'')+'</div>';
  return h+'</div><p style="margin-top:10px">'+msg+'</p><p class="note" style="margin-top:6px">'+gm+'</p><p class="note" style="margin-top:6px">These are the Asian BMI ranges used for Indians. BMI cannot tell muscle from fat, so also watch your waist-to-height ratio under Body measurements.</p></section>';
}

function validStep(){

function foodRes(q){
  q=(q||'').trim().toLowerCase();
  const cat=(V.sheet&&V.sheet.cat)||'';
  let list=Object.values(FD).filter(f=>(!q||f.name.toLowerCase().includes(q)||f.gu.includes(q)||(f.al&&f.al.includes(q))||f.serv.toLowerCase().includes(q))&&(!cat||(cat==='custom'?f.custom:cat==='sweet'?(f.cat==='sweet'||f.cheat):f.cat===cat))&&(cat!=='brand'||!V.sheet.brand||f.brand===V.sheet.brand));
  if(cat&&!q)list.sort((a,b)=>a.name<b.name?-1:1);
  else if(!q)list.sort((a,b)=>((b.custom?1:0)-(a.custom?1:0))||((b.g?1:0)-(a.g?1:0))||((a.cheat?1:0)-(b.cheat?1:0)));
  list=list.slice(0,q||cat?90:60);
  if(!list.length)return '<p class="note">Nothing found. Add it as a custom food.</p>';

}

function plateauInfo(){
  const t=T(),today=todayK(),since=addD(today,-28);
  if(weightNow()<=+S.profile.tw)return{s:'goal'};
  const pts=S.weights.filter(x=>x.d>=since).map(x=>({x:pkey(x.d).getTime()/864e5,y:x.kg}));
  const days=pts.length?pts[pts.length-1].x-pts[0].x:0;
  if(pts.length<3||days<12)return{s:'few',n:pts.length,days:Math.round(days)};
  const n=pts.length,mx=pts.reduce((a,p)=>a+p.x,0)/n,my=pts.reduce((a,p)=>a+p.y,0)/n;
  let sxx=0,sxy=0;for(const p of pts){sxx+=(p.x-mx)*(p.x-mx);sxy+=(p.x-mx)*(p.y-my);}
  const slope=sxx?sxy/sxx*7:0;
  let logged=0;for(let i=1;i<=14;i++){const dl=S.log[addD(today,-i)];if(dl&&dl.items.length>=3)logged++;}
  const ms=(S.meas||[]).filter(m=>m.v&&m.v.waist!=null&&m.d>=since);
  const wd=ms.length>1?ms[0].v.waist-ms[ms.length-1].v.waist:0;
  const exp=t.rate||0;
  let st;
  if(slope<=-0.15)st='ok';else if(slope<0.1)st='plateau';else st='up';
  return{s:st,slope:Math.round(slope*100)/100,exp,logged,wd:Math.round(wd*10)/10,days:Math.round(days),tdee:t.tdee,target:t.target};
}

  const k=dkey(new Date(pkey(S.W.start).getTime()+d*864e5+36e5));
  if(k===todayK())awardQuests();
  checkBadges();
  return pr?'prnew':(prev?'ok':'base');
}
function prCard(){
  const L=S.lifts||[];
  let h='<section class="card"><h2>Personal records</h2>';
  if(!L.length)return h+'<p class="note" style="margin-top:6px">Tap Log on an exercise to record the weight and reps (or seconds) of your best set. Beat your best and you get a record and 20 XP.</p></section>';
  const seen={},order=[];
  for(let j=L.length-1;j>=0;j--){const l=L[j],key=l.ex+'|'+liftMode(l);if(!seen[key]){seen[key]=1;order.push(l);}}
  h+='<div class="col" style="margin-top:8px;gap:6px">';
  for(const l of order.slice(0,8)){
    const mode=liftMode(l),b=liftBest(l.ex,mode),hist=L.filter(x=>x.ex===l.ex&&liftMode(x)===mode),first=hist[0];
    let gain='';
    if(hist.length>1){const g=liftScore(b)-liftScore(first);if(g>0.01)gain=mode==='w'?'+'+Math.round(g/liftScore(first)*100)+'% since your first log':'+'+Math.round(g)+(mode==='sec'?' s':' reps')+' since your first log';}
    h+='<div class="frow" style="cursor:default"><span><b>'+EX[l.ex].name+(l.pr&&l===L[L.length-1]?' · new PR':'')+'</b><small>Best '+liftText(b)+' · '+fmtD(b.d)+(gain?' · '+gain:'')+'</small></span><em>'+hist.length+'×</em></div>';
  }
  h+='</div><p class="note" style="margin-top:8px">'+(S.stats.prs||0)+' record'+((S.stats.prs||0)===1?'':'s')+' broken so far.</p></section>';
  return h;
}
function liftSheet(s){
  const it=S.W.week[s.d].items[s.i],e=EX[it.ex],sec=it.u==='sec',last=liftLast(it.ex),b=liftBest(it.ex,last?liftMode(last):sec?'sec':'bw');
  let h='<h2>Log '+e.name+'</h2><p class="muted">Plan: '+amtText(it)+'. Enter your best set today.</p>';
  if(last)h+='<p class="note">Last time: '+liftText(last)+' on '+fmtD(last.d)+(b&&b!==last?' · best '+liftText(b):'')+'</p>';
  h+=(sec?'':'<label class="field">Weight (kg), leave blank for bodyweight<input type="number" id="lw" inputmode="decimal" step="0.5" min="0" max="500" value="'+(last&&last.w?last.w:'')+'" placeholder="e.g. 20"></label>')
   +'<label class="field">'+(sec?'Seconds held':'Reps in that set')+'<input type="number" id="lr" inputmode="numeric" min="1" max="'+(sec?600:200)+'" value="'+(last?last.r:'')+'" placeholder="'+(sec?'e.g. 40':'e.g. 10')+'"></label><p class="note" id="lerr" style="color:var(--pop)"></p><button class="btn full" data-a="savelift">Save</button><button class="btn ghost full" data-a="closesheet">Cancel</button>';
  return h;
}
// ----- restaurant mode -----
const RGROUPS=[['main','Mains'],['start','Starters and soups'],['bread','Breads and rice'],['south','South Indian'],['fast','Chinese and fast food'],['dess','Desserts'],['drink','Drinks']];
function restoSlotGuess(){const h=new Date().getHours();return h<11?'b':h<15?'l':h<18?'e':'d';}
function restoBudget(slot){
  const td=todayK(),tot=totalsOf(DL(td)).k,tg=T().target,day=S.mp&&S.mp.days[dow(td)],pl=day&&day.slots&&day.slots[slot]?day.slots[slot].k:Math.round(tg*0.3);
  return{plan:pl,left:tg-tot,tot,tg};
}
function restoTotal(sel){let k=0,p=0;for(const id in sel){const f=FD[id];if(f){k+=f.k*sel[id];p+=f.p*sel[id];}}return{k:Math.round(k),p:Math.round(p)};}
function restoSheet(s){
  const bg=restoBudget(s.slot),tot=restoTotal(s.sel),after=bg.tot+tot.k,over=after-bg.tg,n=Object.keys(s.sel).length;
  let h='<h2>Restaurant mode</h2><div class="row wrap">'+SLOTS.map(x=>'<button class="chip'+(s.slot===x[0]?' on':'')+'" data-a="rslot" data-v="'+x[0]+'">'+x[1]+'</button>').join('')+'</div>';
  h+='<div class="rtot"><div class="row sp"><b>Your plate: '+fmtN(tot.k)+' kcal</b><span>'+tot.p+' g protein</span></div><small>Planned for this meal: about '+fmtN(bg.plan)+' kcal · Left today: '+fmtN(Math.max(0,bg.left))+' kcal</small>'
   +(n?'<div class="rverdict '+(over>0?'over':'fit')+'">'+(over>0?'Over today by about '+fmtN(over)+' kcal. Share a dish, skip dessert or the buttered naan, or keep the next meal light.':'Fits. You would end the day at about '+fmtN(after)+' of '+fmtN(bg.tg)+' kcal.')+'</div>':'<div class="rverdict">Tap a dish to add it to your plate. Tap again for more, or use the half-portion buttons when sharing.</div>')+'</div>';
  h+='<div class="row wrap">'+RGROUPS.map(g=>'<button class="chip'+(s.grp===g[0]?' on':'')+'" data-a="rgrp" data-v="'+g[0]+'">'+g[1]+'</button>').join('')+'</div>';
  const list=Object.values(FD).filter(f=>f.cat==='rest'&&f.grp===s.grp);
  h+=list.map(f=>{const q=s.sel[f.id]||0;
    return '<div class="rrow'+(q?' sel':'')+'"><button class="frow" data-a="radd" data-id="'+f.id+'"><span><b>'+f.name.replace(' (restaurant)','')+'</b><small>'+f.serv.replace(', restaurant estimate','')+' · '+f.p+' g protein</small></span><em>'+f.k+' kcal</em></button>'
     +(q?'<div class="rstep"><button data-a="rstep" data-id="'+f.id+'" data-d="-0.5" aria-label="Less">−</button><b>'+fmtQ(q)+' = '+Math.round(f.k*q)+' kcal</b><button data-a="rstep" data-id="'+f.id+'" data-d="0.5" aria-label="More">+</button></div>':'')+'</div>';}).join('');
  h+='<p class="note">These are estimates for typical restaurant portions, which use more oil and butter than home cooking. Real dishes vary by 20 to 30 percent, so treat the totals as a guide.</p>';
  h+='<details><summary>Smart ordering tips</summary><ul class="note" style="margin:6px 0 0 18px;display:flex;flex-direction:column;gap:4px"><li>Choose tandoori or grilled starters over fried ones.</li><li>Pick dal, chana or rajma over cream and butter gravies like malai kofta or shahi paneer.</li><li>Plain roti or tandoori roti is about half the calories of butter naan.</li><li>Ask for less oil and butter, and for gravy on the side.</li><li>Share dessert and starters. Half portions are one tap above.</li><li>Have a salad or soup first. It fills you up.</li></ul></details>';
  h+='<button class="btn full" data-a="rlog"'+(n?'':' disabled')+'>Add '+(n?n+' dish'+(n===1?'':'es')+' ':'')+'to '+SLOTN[s.slot]+'</button><button class="btn ghost full" data-a="closesheet">Close</button>';
  return h;
}
function sheetExtra2(s){
  if(s.type==='lift')return liftSheet(s);
  if(s.type==='resto')return restoSheet(s);
  return null;
}
function restoCard(){return '<section class="card"><h2>Eating out?</h2><p class="muted" style="margin:4px 0 10px">Pick what you plan to order, see calories against your day, then log it in one tap.</p><button class="btn" data-a="restosheet" data-s="'+restoSlotGuess()+'">Restaurant mode</button></section>';}
function restoOpen(slot){V.sheet={type:'resto',slot:slot||restoSlotGuess(),grp:'main',sel:{}};V.keepSc=0;render();}
function restoKeep(){V.keepSc=1;render();}

// ---------- actions ----------
function finishOnb(){
  const f=V.form,p=Object.assign({},f,{age:+f.age,h:+f.h,w:+f.w,tw:+f.tw,pace:+f.pace,days:+f.days});
  if(V.editing&&S){
    const wChanged=Math.abs(p.w-weightNow())>0.01;
    S.profile=p;if(wChanged)S.weights.push({d:todayK(),kg:p.w});
    Object.assign(S.W,{days:p.days,fit:p.fit,body:p.body,equip:p.equip});
    if(p.joint)S.W.lowImpact=true;rebuildWeek();ensurePlans();
  }else{createState(p);}
  V.form=null;V.editing=false;V.onb=0;V.tab='today';saveS();render();window.scrollTo(0,0);
}
function onClick(e){
  const el=e.target.closest('[data-a]');if(!el)return;
  const a=el.dataset.a,d=el.dataset;
  switch(a){
    case 'pick':{if(d.k==='cirate'){V.sheet.rate=d.v;render();return;}const v=d.v;V.form[d.k]=(d.k==='pace')?+v:(d.k==='days'?+v:v);render();return;}
    case 'flip':V.form[d.k]=!V.form[d.k];render();return;
    case 'onnext':{V.err=validStep();if(V.err){render();return;}if(V.onb<4){V.onb++;render();window.scrollTo(0,0);}else finishOnb();return;}
    case 'onback':V.err='';V.onb=Math.max(0,V.onb-1);render();window.scrollTo(0,0);return;
    case 'oncancel':V.form=null;V.editing=false;V.onb=0;V.err='';render();return;
    case 'tab':V.tab=d.t;V.sheet=null;V.resetAsk=false;render();window.scrollTo(0,0);return;
    case 'closesheet':V.sheet=null;V.delAsk=false;render();return;
    case 'liftsheet':V.sheet={type:'lift',d:+d.d,i:+d.i};render();return;
    case 'savelift':{
      const it=S.W.week[V.sheet.d].items[V.sheet.i],sec=it.u==='sec',wEl=$('#lw'),w=wEl&&wEl.value!==''?+wEl.value:0,r=+$('#lr').value;
      if(!(r>=1&&r<=(sec?600:200))){$('#lerr').textContent=sec?'Enter seconds between 1 and 600.':'Enter reps between 1 and 200.';return;}
      if(!(w>=0&&w<=500)){$('#lerr').textContent='Weight should be between 0 and 500 kg.';return;}
      const res=saveLift(V.sheet.d,V.sheet.i,w,r);V.sheet=null;saveS();render();
      toast(res==='prnew'?'New personal record! +20 XP':res==='base'?'Logged. This is your starting mark.':'Logged');return;}
    case 'rwk':V.rw=Math.min(0,Math.max(-12,(V.rw||0)+(+d.d)));render();return;
    case 'restosheet':restoOpen(d.s);return;
    case 'rslot':V.sheet.slot=d.v;restoKeep();return;
    case 'rgrp':V.sheet.grp=d.v;V.keepSc=0;render();return;
    case 'radd':V.sheet.sel[d.id]=(V.sheet.sel[d.id]||0)+1;restoKeep();return;
    case 'rstep':{const q=Math.round(((V.sheet.sel[d.id]||0)+(+d.d))*100)/100;if(q<=0)delete V.sheet.sel[d.id];else V.sheet.sel[d.id]=Math.min(10,q);restoKeep();return;}
    case 'rlog':{const sel=V.sheet.sel,slot=V.sheet.slot;if(!Object.keys(sel).length)return;for(const id in sel)addItem(todayK(),slot,id,sel[id]);S.stats.resto=(S.stats.resto||0)+1;V.sheet=null;commit();toast('Added to '+SLOTN[slot]);return;}
    case 'fcat':V.sheet.cat=d.v;if(d.v!=='brand')V.sheet.brand='';render();return;
    case 'fbrand':V.sheet.brand=d.v;render();return;
    case 'addphoto':{const i=$('#phin');if(i)i.click();return;}
    case 'viewphoto':V.sheet={type:'photo',i:+d.i};V.delAsk=false;render();return;
    case 'delphoto':{if(!V.delAsk){V.delAsk=true;render();return;}const p=(PH||[])[V.sheet.i];if(p){idbDel(p.id).catch(()=>{});PH.splice(V.sheet.i,1);}V.delAsk=false;V.sheet=null;render();toast('Photo deleted');return;}
    case 'phall':V.phAll=!V.phAll;render();return;
    case 'backup':doBackup(false);return;
    case 'backupshare':doBackup(true);return;
    case 'restorepick':{const i=$('#rsin');if(i)i.click();return;}
    case 'dorestore':applyRestore();return;
    case 'day':V.day=+d.i;render();return;
    case 'tday':V.tday=+d.i;render();return;
    case 'pref':S.profile[d.k]=d.v;ensurePlans();saveS();render();return;
    case 'prefb':S.profile[d.k]=!S.profile[d.k];ensurePlans();saveS();render();return;
    case 'reroll':S.seed=Math.floor(Math.random()*1e9);ensurePlans();saveS();render();toast('New week plan ready');return;
    case 'swapmeal':V.sheet={type:'planswap',i:+d.i,slot:d.s};render();return;
    case 'pickopt':{swapOpt(S.mp.days[V.sheet.i],V.sheet.slot,d.id);V.sheet=null;saveS();render();return;}
    case 'logplan':{const k=todayK(),x=S.mp.days[+d.i].slots[d.s];if(DL(k).items.some(i=>i.slot===d.s)){toast('That meal already has food logged');return;}for(const it of x.items)addItem(k,d.s,it[0],it[1]);commit();return;}
    case 'addfood':V.sheet={type:'food',slot:d.s,sel:null,qty:1};render();return;
    case 'pickfood':V.sheet.sel=d.id;V.sheet.qty=1;render();return;
    case 'unpick':V.sheet.sel=null;render();return;
    case 'qty':{V.sheet.qty=Math.max(0.5,Math.round((V.sheet.qty+(+d.d)*0.5)*100)/100);render();return;}
    case 'qset':V.sheet.qty=+d.v;render();return;
    case 'editqty':{const it=DL(todayK()).items.find(x=>x.id===d.id);if(!it)return;V.sheet={type:'editqty',id:it.id,name:it.n,sv:it.sv,qty:it.q,u:{k:it.k/it.q,p:it.p/it.q,c:it.c/it.q,f:it.fa/it.q,fi:(it.fi||0)/it.q}};render();return;}
    case 'saveqty':{const sh=V.sheet,it=DL(todayK()).items.find(x=>x.id===sh.id);if(it&&sh.qty>0){it.q=sh.qty;it.k=Math.round(sh.u.k*sh.qty);it.p=+(sh.u.p*sh.qty).toFixed(1);it.c=+(sh.u.c*sh.qty).toFixed(1);it.fa=+(sh.u.f*sh.qty).toFixed(1);it.fi=+((sh.u.fi||0)*sh.qty).toFixed(1);}V.sheet=null;commit();toast('Amount updated');return;}
    case 'confirmfood':{addItem(todayK(),V.sheet.slot,V.sheet.sel,V.sheet.qty);V.sheet=null;commit();return;}
    case 'customsheet':V.sheet={type:'custom',slot:V.sheet.slot};render();return;
    case 'saveccustom':{
      const n=$('#cn').value.trim(),sv=($('#cs').value||'').trim()||'1 serving',p=+$('#cp').value||0,c=+$('#cc').value||0,f=+$('#cf').value||0,fi=+($('#cfi')?$('#cfi').value:0)||0;let k=+$('#ck').value||0;
      if(!n){$('#cerr').textContent='Enter a name for the food.';return;}
      if(p<0||c<0||f<0||k<0||fi<0){$('#cerr').textContent='Values cannot be negative.';return;}
      if(!k)k=Math.round(4*p+4*c+9*f);
      if(!(k>0)){$('#cerr').textContent='Enter the calories, or at least one of protein, carbs or fat.';return;}
      if(k>3000||p>300||c>600||f>300||fi>100){$('#cerr').textContent='That looks too large for one serving. Check the numbers.';return;}
      if(!S.custom)S.custom=[];
      const cf={id:'c_'+uid(),name:n,serv:sv,p,c,f,fi,k};S.custom.push(cf);regCustom(cf);
      V.sheet={type:'food',slot:V.sheet.slot,sel:cf.id,qty:1};saveS();render();return;}
    case 'delcustom':{const id=V.sheet.sel;S.custom=(S.custom||[]).filter(x=>x.id!==id);delete FD[id];V.sheet.sel=null;saveS();render();toast('Food deleted');return;}
    case 'delitem':{const dl=DL(todayK());dl.items=dl.items.filter(i=>i.id!==d.id);saveS();render();return;}
    case 'water':{const dl=DL(todayK()),n=+d.n;dl.water=dl.water===n?n-1:n;commit();return;}
    case 'walk':DL(todayK()).walk=true;commit();return;
    case 'closeday':{const dl=DL(todayK());if(closeOK(dl)&&!dl.q.close){dl.q.close=1;addXP(30,'Day closed');}commit();return;}
    case 'cheatsheet':V.sheet={type:'cheat'};render();return;
    case 'cheatday':S.cheat.day=+d.i;ensurePlans();saveS();render();return;
    case 'setcheat':S.cheat.id=d.id;if(S.cheat.day<0)S.cheat.day=6;ensurePlans();saveS();V.sheet=null;V.day=S.cheat.day;render();return;
    case 'nocheat':S.cheat.day=-1;ensurePlans();saveS();V.sheet=null;render();return;
    case 'exdone':{const it=S.W.week[+d.d].items[+d.i];it.done=!it.done;
      if(it.done&&!it.xpd){it.xpd=1;addXP(3,EX[it.ex].name);}
      const k=dkey(new Date(pkey(S.W.start).getTime()+(+d.d)*864e5+36e5));
      if(k===todayK())awardQuests();saveS();render();return;}
    case 'swapex':V.sheet={type:'exswap',d:+d.d,i:+d.i};render();return;
    case 'pickex':{
      const it=S.W.week[V.sheet.d].items[V.sheet.i],old=EX[it.ex],ne=EX[d.id],pr=presc(ne,S.W);
      Object.assign(it,{ex:ne.id,sets:pr.sets,amt:pr.amt,u:pr.u,done:false});
      if(ne.lv<old.lv)S.W.lv[ne.pat]=Math.min(S.W.lv[ne.pat],ne.lv);else if(ne.lv>old.lv)S.W.lv[ne.pat]=Math.max(S.W.lv[ne.pat],ne.lv);
      S.stats.swaps++;V.sheet=null;toast('Swapped to '+ne.name);commit();return;}
    case 'lowimpact':S.W.lowImpact=!S.W.lowImpact;rebuildWeek();saveS();render();return;
    case 'endweek':case 'checkin':V.sheet={type:'checkin',rate:null,pain:false,err:''};render();return;
    case 'cirate':V.sheet.rate=d.v;render();return;
    case 'ciflip':V.sheet.pain=!V.sheet.pain;render();return;
    case 'cisubmit':{
      const sh=V.sheet;if(!sh.rate){sh.err='Choose how the week felt.';render();return;}
      const kg=+$('#ciw').value;if(!(kg>=30&&kg<=250)){sh.err='Enter your weight in kg.';render();return;}
      const sess=S.W.week.filter(x=>!x.rest),done=sess.filter(x=>x.items.filter(i=>i.part==='main').every(i=>i.done)).length;
      let msg='Week '+(S.W.num+1)+' is ready';
      adaptW(S.W,sh.rate,sh.pain);
      if(done<sess.length/2&&S.W.days>3){S.W.days--;msg+=', with one fewer session';}
      if(done===sess.length&&sess.length>0)S.stats.iron++;
      S.W.hist.push({week:S.W.num,done,total:sess.length,rate:sh.rate});
      if(Math.abs(kg-weightNow())>0.01||S.weights[S.weights.length-1].d!==todayK())S.weights.push({d:todayK(),kg});
      S.W.num++;S.W.start=monK(todayK());S.W.pending=false;S.stats.checkins++;addXP(50,'Weekly check-in');
      rebuildWeek();V.tday=null;V.sheet=null;commit();toast(msg);return;}
    case 'weightsheet':V.sheet={type:'weight'};render();return;
    case 'saveweight':{const kg=+$('#nw').value;if(!(kg>=30&&kg<=250))return;S.weights.push({d:todayK(),kg});V.sheet=null;commit();return;}
    case 'meassheet':V.sheet={type:'meas'};render();return;
    case 'mkey':V.mk=d.k;render();return;
    case 'savemeas':{
      const vals={};let any=false;
      for(const m of MEAS){const raw=$('#m_'+m[0]).value;if(raw===''||raw==null)continue;const n=+raw;
        if(!(n>=m[3]&&n<=m[4])){$('#merr').textContent=m[1]+' should be between '+m[3]+' and '+m[4]+' cm.';return;}
        vals[m[0]]=n;any=true;}
      if(!any){$('#merr').textContent='Enter at least one measurement.';return;}
      const t=todayK();let e=S.meas.find(x=>x.d===t);if(e)Object.assign(e.v,vals);else S.meas.push({d:t,v:vals});
      V.sheet=null;commit();toast('Measurements saved');return;}
    case 'editprofile':V.form=Object.assign({},S.profile);V.editing=true;V.onb=0;render();window.scrollTo(0,0);return;
    case 'reset':{if(!V.resetAsk){V.resetAsk=true;render();return;}try{localStorage.removeItem(KEY);}catch(x){}S=null;V.form=blankForm();V.editing=false;V.onb=0;V.resetAsk=false;V.tab='today';render();window.scrollTo(0,0);return;}
  }
}
function onInput(e){
  const t=e.target;
  if(t.dataset&&t.dataset.f&&V.form){V.form[t.dataset.f]=t.value;return;}
  if(t.id==='fq'){if(V.sheet)V.sheet.q=t.value;$('#fres').innerHTML=foodRes(t.value);}
  if(t.id==='qin'&&V.sheet){const q=Math.round(+t.value*100)/100;if(q>0&&q<=50){V.sheet.qty=q;const uu=V.sheet.type==='editqty'?V.sheet.u:FD[V.sheet.sel];$('#qnum').textContent=fmtQ(q);$('#qsum').innerHTML=qsum(uu,q);}}
}
function onChange(e){
  const t=e.target;if(!S)return;
  if(t.id==='phin'){const f=t.files&&t.files[0];t.value='';addPhotoFile(f);return;}
  if(t.id==='rsin'){const f=t.files&&t.files[0];t.value='';readRestore(f);return;}
  if(t.id==='s_days'||t.id==='s_equip'||t.id==='s_body'){
    S.W.days=+$('#s_days').value;S.W.equip=$('#s_equip').value;S.W.body=$('#s_body').value;
    S.profile.days=S.W.days;S.profile.equip=S.W.equip;S.profile.body=S.W.body;
    rebuildWeek();saveS();render();toast('Week rebuilt');
  }
}
document.addEventListener('click',onClick);
document.addEventListener('input',onInput);
document.addEventListener('change',onChange);
// ---------- boot ----------
(function boot(){
  S=loadS();
  if(S&&S.custom)S.custom.forEach(regCustom);
  if(!S){V.form=blankForm();}
  else{try{finalizePast();ensurePlans();awardQuests();saveS();}catch(err){console.error(err);}}
  render();
})();

if('serviceWorker' in navigator){window.addEventListener('load',function(){navigator.serviceWorker.register('sw.js').catch(function(){});});}
