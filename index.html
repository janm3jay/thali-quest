<style>:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);-webkit-text-size-adjust:100%}[hidden]{display:none!important}img{max-width:100%}</style>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Baloo+Bhai+2:wght@500;700;800&family=Hind+Vadodara:wght@400;500;600;700&display=swap">
<style>
/* Layout: one phone-width column of chunky sticker cards with hard outlines and offset shadows, five-tab floating bar, bottom sheets. Night-arcade ink with lime for progress, hot pink for streaks, sun yellow for XP, cyan for water. */
:root{
 --bg:#150F33;--surface:#221A4D;--surface2:#2E2468;--ink:#F8F4FF;--muted:#B3A9E6;--edge:#07041C;--line:#3D3380;
 --accent:#C6FF3D;--on-accent:#15103A;--pop:#FF4F9A;--on-pop:#FFFFFF;--gold:#FFC93C;--on-gold:#2A1B00;--cyan:#3DE3FF;--on-cyan:#00232B;--chili:#FF6B4A;
 --glow1:rgba(255,79,154,.22);--glow2:rgba(61,227,255,.16);
 --display:'Baloo Bhai 2','Hind Vadodara',system-ui,sans-serif;
 --body:'Hind Vadodara',system-ui,-apple-system,'Segoe UI',sans-serif;
 color-scheme:dark;
}
@media (prefers-color-scheme:light){:root:not([data-theme="dark"]){--bg:#EEE8FF;--surface:#FFFFFF;--surface2:#F3EEFF;--ink:#1B1347;--muted:#5F55A6;--edge:#1B1347;--line:#CFC4F7;--accent:#6B2FF5;--on-accent:#FFFFFF;--pop:#E8197D;--on-pop:#FFFFFF;--gold:#FFC93C;--on-gold:#2A1B00;--cyan:#12B7D6;--on-cyan:#00232B;--chili:#E4472A;--glow1:rgba(232,25,125,.14);--glow2:rgba(18,183,214,.14);color-scheme:light}}
:root[data-theme="light"]{--bg:#EEE8FF;--surface:#FFFFFF;--surface2:#F3EEFF;--ink:#1B1347;--muted:#5F55A6;--edge:#1B1347;--line:#CFC4F7;--accent:#6B2FF5;--on-accent:#FFFFFF;--pop:#E8197D;--on-pop:#FFFFFF;--gold:#FFC93C;--on-gold:#2A1B00;--cyan:#12B7D6;--on-cyan:#00232B;--chili:#E4472A;--glow1:rgba(232,25,125,.14);--glow2:rgba(18,183,214,.14);color-scheme:light}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{margin:0;background-color:var(--bg);background-image:radial-gradient(circle at 0% 0%,var(--glow1),transparent 45%),radial-gradient(circle at 100% 30%,var(--glow2),transparent 40%);background-attachment:fixed;color:var(--ink);font:15px/1.45 var(--body);font-variant-numeric:tabular-nums;padding-block:0;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
#app{max-width:520px;margin:0 auto;padding-block:16px 112px;display:flex;flex-direction:column;gap:16px}
h1,h2,h3{font-family:var(--display);margin:0;text-wrap:balance;line-height:1.1}
h1{font-size:34px;font-weight:800;letter-spacing:-.01em}h2{font-size:22px;font-weight:800}h3{font-size:18px;font-weight:700}
p{margin:0}small,.muted{color:var(--muted)}small{font-size:12.5px}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible,input:focus-visible,select:focus-visible,summary:focus-visible,a:focus-visible{outline:3px solid var(--cyan);outline-offset:2px}
/* sticker cards */
.card{background:var(--surface);border:2.5px solid var(--edge);border-radius:22px;padding:16px;box-shadow:0 6px 0 var(--edge)}
.row{display:flex;gap:10px;align-items:center}.sp{justify-content:space-between}.wrap{flex-wrap:wrap}.col{display:flex;flex-direction:column;gap:10px}
.btn{background:var(--accent);color:var(--on-accent);border:2.5px solid var(--edge);border-radius:14px;padding:10px 18px;font:800 16px var(--display);min-height:46px;box-shadow:0 4px 0 var(--edge);transition:transform .08s,box-shadow .08s}
.btn:active{transform:translateY(4px);box-shadow:0 0 0 var(--edge)}
.btn.ghost{background:var(--surface);color:var(--ink)}
.btn.sm{padding:4px 12px;min-height:36px;font-size:14.5px;border-radius:12px;box-shadow:0 3px 0 var(--edge)}.btn.sm:active{transform:translateY(3px)}
.btn.gold{background:var(--gold);color:var(--on-gold)}
.btn.pop{background:var(--pop);color:var(--on-pop)}
.btn[disabled]{opacity:.5;box-shadow:0 4px 0 var(--edge);transform:none;cursor:default}
.btn.full{width:100%}
.chip{border:2.5px solid var(--edge);background:var(--surface);border-radius:999px;padding:5px 14px;font:700 14.5px var(--display);box-shadow:0 3px 0 var(--edge)}
.chip:active{transform:translateY(3px);box-shadow:none}
.chip.on{background:var(--accent);color:var(--on-accent)}
.pill{display:inline-block;border-radius:999px;padding:1px 11px;font:700 13px var(--display);background:var(--surface2);border:2px solid var(--edge)}
.pill.warn{background:var(--chili);color:#fff}
.ic{width:22px;height:22px;flex:none}
.gu{font-size:12.5px;color:var(--muted);margin-left:4px}
/* header */
.top{display:flex;gap:12px;align-items:center}
.lvl{width:56px;height:56px;border-radius:18px;background:linear-gradient(145deg,var(--gold),var(--pop));color:#fff;display:grid;place-items:center;flex:none;border:2.5px solid var(--edge);box-shadow:0 4px 0 var(--edge);transform:rotate(-6deg)}
.lv{font:800 28px var(--display);text-shadow:0 2px 0 var(--edge)}
.who{flex:1;min-width:0}.who b{font:800 19px var(--display)}
.xpbar{height:14px;border-radius:99px;background:var(--surface2);border:2.5px solid var(--edge);overflow:hidden;margin:3px 0 2px}
.xpbar i{display:block;height:100%;background:repeating-linear-gradient(-45deg,var(--gold) 0 8px,#FFE08A 8px 16px);background-size:22px 22px;animation:slide 1.2s linear infinite;border-right:2.5px solid var(--edge)}
@keyframes slide{to{background-position:22px 0}}
.streak{display:flex;align-items:center;gap:2px;color:var(--pop);font:800 24px var(--display);background:var(--surface);border:2.5px solid var(--edge);border-radius:16px;padding:2px 10px;box-shadow:0 3px 0 var(--edge)}
.streak .ic{width:24px;height:24px;fill:var(--pop)}
/* ring */
.ringcard{display:flex;gap:14px;align-items:center}
.ring{width:140px;height:140px;flex:none;filter:drop-shadow(0 0 8px var(--glow2))}
.rbg{fill:none;stroke:var(--surface2);stroke-width:14}.rfg{fill:none;stroke:var(--accent);stroke-width:14;stroke-linecap:round}.rfg.over{stroke:var(--chili)}
.rnum{font:800 34px var(--display);fill:var(--ink)}.rsub{font:600 11px var(--body);fill:var(--muted)}
.macros{flex:1;min-width:0;display:flex;flex-direction:column;gap:8px}
.mb{display:grid;gap:2px;font:600 12.5px var(--body)}.mb .bar{height:10px;border-radius:9px;background:var(--surface2);border:2px solid var(--edge);overflow:hidden}.mb .bar i{display:block;height:100%;background:var(--accent)}.mb.f .bar i{background:var(--gold)}.mb.c .bar i{background:var(--cyan)}.mb.fi .bar i{background:var(--pop)}
.left{font-size:13.5px}.left b{font:800 22px var(--display)}
/* quests */
.q{display:flex;gap:10px;align-items:center;padding:10px 0;border-top:2px dashed var(--line)}.q:first-of-type{border-top:0}
.qc{width:30px;height:30px;border-radius:10px;border:2.5px solid var(--edge);display:grid;place-items:center;flex:none;background:var(--surface2);padding:0;color:var(--on-accent)}
.q.done .qc{background:var(--accent)}.q.done .qt{text-decoration:line-through;color:var(--muted)}
.qc .ic{width:17px;height:17px;stroke-width:3}.qt{flex:1;min-width:0;font-weight:500}
.xp{font:800 13px var(--display);background:var(--gold);color:var(--on-gold);border:2px solid var(--edge);border-radius:99px;padding:0 9px}
/* log */
.slot{border-top:2px dashed var(--line);padding-top:12px;margin-top:12px}.slot:first-child{border-top:0;padding-top:0;margin-top:0}
.slot b{font:800 17px var(--display)}
.it{display:flex;justify-content:space-between;gap:8px;padding:5px 0;font-size:14px}.it span{min-width:0}.it em{font-style:normal;font-weight:700;white-space:nowrap}
.x{border:0;background:none;color:var(--muted);padding:0 4px;font-size:20px;line-height:1}
.hint{background:var(--surface2);border:2px dashed var(--line);border-radius:14px;padding:7px 10px;font-size:13px;display:flex;justify-content:space-between;gap:8px;align-items:center;margin-top:6px}
.drops{display:flex;gap:7px;flex-wrap:wrap}
.drop{width:36px;height:40px;border-radius:12px;border:2.5px solid var(--edge);background:var(--surface2);color:var(--line);display:grid;place-items:center;padding:0}.drop.on{background:var(--cyan);color:var(--on-cyan)}
/* day chips */
.days{display:grid;grid-template-columns:repeat(7,1fr);gap:6px}
.dchip{border:2.5px solid var(--edge);background:var(--surface);border-radius:14px;padding:8px 0;font:800 14px var(--display);position:relative;box-shadow:0 3px 0 var(--edge)}
.dchip:active{transform:translateY(3px);box-shadow:none}
.dchip.on{background:var(--accent);color:var(--on-accent)}.dchip.now:not(.on){background:var(--surface2);border-color:var(--cyan)}
.dchip .dot{position:absolute;top:3px;right:4px;width:9px;height:9px;border-radius:50%;background:var(--pop);border:2px solid var(--edge)}
.dchip .tk{display:block;font:600 10px var(--body);opacity:.85}
/* meals */
.meal ul{list-style:none;margin:8px 0 12px;padding:0}.meal li{display:flex;justify-content:space-between;gap:8px;font-size:14px;padding:3px 0}.meal li small{text-align:right}
.slotname{font:800 12.5px var(--display);letter-spacing:.08em;text-transform:uppercase;color:var(--on-pop);background:var(--pop);border:2px solid var(--edge);border-radius:99px;padding:0 10px}
.cheatc{background:linear-gradient(160deg,var(--surface),var(--surface2))}.cheatc.meal .slotname{background:var(--gold);color:var(--on-gold)}
section.cheatc{border-color:var(--edge)}
/* workout */
.ex{display:flex;gap:10px;padding:12px 0;border-top:2px dashed var(--line)}.ex:first-of-type{border-top:0}
.ex.done .en{text-decoration:line-through;color:var(--muted)}
.en{font:700 16px var(--display)}.ex details{margin-top:4px;font-size:13.5px;color:var(--muted)}.ex summary{cursor:pointer;color:var(--cyan);font-weight:600}
.ex a{color:var(--cyan);font-weight:700;font-size:14px}
.part{font:800 12.5px var(--display);letter-spacing:.09em;text-transform:uppercase;color:var(--pop);margin:8px 0 0}
/* rewards */
.badges{display:grid;grid-template-columns:repeat(3,1fr);gap:14px 8px}
.bd{text-align:center;display:flex;flex-direction:column;align-items:center;gap:4px;font-size:12.5px;line-height:1.25}
.bd b{font:700 13.5px var(--display)}
.bd i{width:58px;height:58px;border-radius:20px;display:grid;place-items:center;background:linear-gradient(145deg,var(--gold),var(--pop));color:#fff;border:2.5px solid var(--edge);box-shadow:0 4px 0 var(--edge);transform:rotate(-4deg)}
.bd:nth-child(even) i{transform:rotate(4deg)}
.bd.lock i{background:var(--surface2);color:var(--muted);box-shadow:none}.bd.lock{opacity:.75}
.bd .ic{width:26px;height:26px}
.prog{height:16px;border-radius:99px;background:var(--surface2);border:2.5px solid var(--edge);overflow:hidden}.prog i{display:block;height:100%;background:var(--accent);border-right:2.5px solid var(--edge)}
.stat{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.stat div{background:var(--surface);border:2.5px solid var(--edge);border-radius:18px;padding:10px 12px;box-shadow:0 4px 0 var(--edge)}
.stat div:nth-child(1){background:var(--accent);color:var(--on-accent)}.stat div:nth-child(2){background:var(--pop);color:var(--on-pop)}.stat div:nth-child(3){background:var(--cyan);color:var(--on-cyan)}.stat div:nth-child(4){background:var(--gold);color:var(--on-gold)}
.stat b{display:block;font:800 28px var(--display);line-height:1.1}.stat span{font-size:12.5px;font-weight:600;opacity:.85}
.card .stat div{box-shadow:0 3px 0 var(--edge)}
/* forms */
.field{display:flex;flex-direction:column;gap:5px;font:700 14.5px var(--display)}
input[type=text],input[type=number],input[type=search],select{font:500 16px var(--body);background:var(--surface);color:var(--ink);border:2.5px solid var(--edge);border-radius:14px;padding:10px 12px;min-height:46px;width:100%;box-shadow:inset 0 3px 0 var(--surface2)}
.seg{display:flex;gap:8px;flex-wrap:wrap}.seg .chip{flex:1;text-align:center;min-width:80px}
.opt{display:block;width:100%;text-align:left;border:2.5px solid var(--edge);background:var(--surface);border-radius:18px;padding:11px 14px;box-shadow:0 4px 0 var(--edge)}
.opt:active{transform:translateY(4px);box-shadow:none}
.opt.on{background:var(--accent);color:var(--on-accent)}.opt.on small{color:var(--on-accent);opacity:.8}
.opt b{display:block;font:800 17px var(--display)}.opt small{display:block}
.dots{display:flex;gap:6px}.dots i{flex:1;height:10px;border-radius:9px;background:var(--surface2);border:2px solid var(--edge)}.dots i.on{background:var(--pop)}
.err{color:var(--chili);font-weight:600;font-size:13.5px}
/* sheet */
.ov{position:fixed;inset:0;background:rgba(5,3,20,.6);z-index:40}
.sheet{position:fixed;left:0;right:0;bottom:0;z-index:41;background:var(--bg);border:2.5px solid var(--edge);border-bottom:0;border-radius:28px 28px 0 0;max-height:88%;overflow-y:auto;padding:12px max(16px,env(safe-area-inset-right,0px)) calc(24px + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px));max-width:560px;margin:0 auto;display:flex;flex-direction:column;gap:12px}
.grab{width:50px;height:6px;border-radius:9px;background:var(--line);align-self:center;flex:none}
.frow{display:flex;justify-content:space-between;gap:10px;align-items:center;width:100%;text-align:left;background:var(--surface);border:2.5px solid var(--edge);border-radius:16px;padding:9px 12px;margin-bottom:8px;box-shadow:0 3px 0 var(--edge)}
.frow:active{transform:translateY(3px);box-shadow:none}
.frow span{min-width:0}.frow b{font:700 16px var(--display)}.frow small{display:block}.frow em{font:800 15px var(--display);font-style:normal;white-space:nowrap;background:var(--gold);color:var(--on-gold);border:2px solid var(--edge);border-radius:99px;padding:0 9px}
.stepper{display:flex;align-items:center;gap:16px;justify-content:center}.stepper button{width:52px;height:52px;border-radius:16px;border:2.5px solid var(--edge);background:var(--accent);color:var(--on-accent);font:800 28px var(--display);box-shadow:0 4px 0 var(--edge)}.stepper button:active{transform:translateY(4px);box-shadow:none}.stepper b{font:800 38px var(--display);min-width:64px;text-align:center}
/* nav */
nav{position:fixed;left:0;right:0;bottom:0;z-index:30;padding:0 max(14px,env(safe-area-inset-right,0px)) calc(10px + env(safe-area-inset-bottom,0px)) max(14px,env(safe-area-inset-left,0px));pointer-events:none}
nav .in{max-width:520px;margin:0 auto;display:grid;grid-template-columns:repeat(5,1fr);gap:2px;background:var(--surface);border:2.5px solid var(--edge);border-radius:24px;padding:5px;box-shadow:0 5px 0 var(--edge);pointer-events:auto}
nav button{background:none;border:0;border-radius:18px;display:flex;flex-direction:column;align-items:center;gap:0;font:700 12px var(--display);color:var(--muted);padding:5px 0;min-height:50px}
nav button.on{background:var(--accent);color:var(--on-accent)}
#toast{position:fixed;left:50%;transform:translate(-50%,20px) scale(.9);bottom:calc(96px + env(safe-area-inset-bottom,0px));background:var(--gold);color:var(--on-gold);border:2.5px solid var(--edge);box-shadow:0 4px 0 var(--edge);padding:8px 18px;border-radius:99px;font:800 16px var(--display);opacity:0;pointer-events:none;transition:opacity .2s,transform .25s cubic-bezier(.3,1.6,.5,1);z-index:60;max-width:90%;text-align:center}
#toast.show{opacity:1;transform:translate(-50%,0) scale(1)}
@media (prefers-reduced-motion:reduce){#toast,.btn,.xpbar i{transition:none;animation:none}}
.note{font-size:13px;color:var(--muted)}
.band{display:flex;align-items:center;gap:10px;padding:7px 0;border-top:2px dashed var(--line)}.band:first-child{border-top:0}.band i{width:14px;height:14px;border-radius:50%;border:2.5px solid var(--edge);flex:none}
svg text{font-family:var(--body)}
</style>

<script>

F('sprouts','Moong sprouts salad','ફણગાવેલા મગ','1 bowl (100 g)',6,11,0.4);
F('chana','Roasted chana','શેકેલા ચણા','30 g',6,18,1.6);

F('bhindi','Bhindi sabzi','ભીંડાનું શાક','1 katori (100 g)',2,7,5,{g:1});
F('ringan','Ringan bharelu','ભરેલા રીંગણ','1 katori (100 g)',2,8,8,{g:1});

const CHEAT=id=>CHEATS.find(c=>c.id===id);

function rng(seed){let s=(seed>>>0)||1;return()=>{s=(Math.imul(s,1664525)+1013904223)>>>0;return s/4294967296;};}
function shuffle(a,r){a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(r()*(i+1));const t=a[i];a[i]=a[j];a[j]=t;}return a;}
const snap=(x,st)=>Math.max(st,Math.round(x/st)*st);
const LOCK=new Set(['tea','chaas','salad','raita','banana','apple','guava','papaya','curd','milk']);
function scaleOpt(opt,desired){const base=itemsMacro(opt.items).k;const s=desired/base;return opt.items.map(a=>[a[0],LOCK.has(a[0])?a[1]:snap(a[1]*s,FD[a[0]].step)]);}
function dayTotal(slots){let k=0,p=0,c=0,f=0,fi=0;for(const s in slots){const x=slots[s];k+=x.k;p+=x.p;c+=x.c;f+=x.f;fi+=(x.fi||0);}return{k:Math.round(k),p:Math.round(p),c:Math.round(c),f:Math.round(f),fi:Math.round(fi)};}
function planDay(target,picks,cheat){
  const share={b:.25,m:.08,l:.32,e:.10,d:.25};
  let rem=target,slots=SLOTS.map(s=>s[0]);const out={};
  if(cheat){out[cheat.slot]={cheat:true,name:cheat.name,items:cheat.items.map(x=>x.slice())};const ck=itemsMacro(cheat.items).k;slots=slots.filter(s=>s!==cheat.slot);rem=Math.max(target-ck,target*0.4);}
  const tot=slots.reduce((a,s)=>a+share[s],0);
  for(const s of slots){const o=picks[s];out[s]={opt:o.id,name:o.name,items:scaleOpt(o,rem*share[s]/tot),base:o.items.map(x=>x[1])};}
  const adj=[];for(const s of slots)out[s].items.forEach((it,i)=>{if(!LOCK.has(it[0]))adj.push([s,i]);});
  const total=()=>{let t=0;for(const s in out)t+=itemsMacro(out[s].items).k;return t;};
  for(let n=0;n<60;n++){
    const diff=target-total();let best=null,be=Math.abs(diff);
    for(const a of adj){const it=out[a[0]].items[a[1]],f=FD[it[0]],bq=out[a[0]].base?out[a[0]].base[a[1]]:it[1];
      for(const dir of[1,-1]){const nq=it[1]+dir*f.step;if(nq<f.step-1e-9||nq>Math.max(bq*2.5,bq+2))continue;const err=Math.abs(diff-dir*f.step*f.k);if(err<be-1e-9){be=err;best=[a[0],a[1],nq];}}}
    if(!best)break;out[best[0]].items[best[1]][1]=best[2];
  }
  for(const s in out){delete out[s].base;Object.assign(out[s],itemsMacro(out[s].items));}
  return{slots:out,cheat:!!cheat,total:dayTotal(out)};
}
function buildWeek(target,prefs,seed){
  const r=rng(seed),decks={};
  for(const sl of SLOTS){const s=sl[0];let pool=OPTS.filter(o=>o.slot===s&&!(prefs.jain&&o.nj));pool=shuffle(pool,r);
    const sc=o=>(prefs.style==='gu'&&o.g?2:0)+(prefs.hp&&o.hp?1:0);pool.sort((a,b)=>sc(b)-sc(a));decks[s]=pool;}
  const idx={b:0,m:0,l:0,e:0,d:0},days=[];
  for(let d=0;d<7;d++){
    const fams=new Set(),picks={};
    for(const sl of SLOTS){const s=sl[0],deck=decks[s];let pick=null;
      for(let t=0;t<deck.length;t++){const o=deck[(idx[s]+t)%deck.length];if(!fams.has(o.fam)){pick=o;idx[s]=idx[s]+t+1;break;}}
      if(!pick){pick=deck[idx[s]%deck.length];idx[s]++;}
      fams.add(pick.fam);picks[s]=pick;}
    const ch=(prefs.cheatDay===d&&prefs.cheatId)?CHEAT(prefs.cheatId):null;
    days.push(planDay(target,picks,ch?{slot:ch.slot,name:ch.name,items:ch.items}:null));
  }
  return days;
}
function swapOpt(day,slot,optId){
  const cur=day.slots[slot],o=OPT(optId),items=scaleOpt(o,cur.k);
  day.slots[slot]=Object.assign({opt:o.id,name:o.name,items},itemsMacro(items));day.total=dayTotal(day.slots);
}

function calcPlan(p){
  const w=+p.w,h=+p.h,age=+p.age,tw=+p.tw,pace=+p.pace;
  const bmi=w/((h/100)**2);
  const bmr=10*w+6.25*h-5*age+(p.sex==='m'?5:-161);
  const af={sed:1.2,light:1.375,mod:1.55,act:1.725}[p.act]||1.375;
  const tdee=Math.round(bmr*af);
  const toLose=Math.max(0,w-tw),floor=p.sex==='m'?1500:1200,warn=[];
  let target,mode='lose';
  if(toLose<=0){target=tdee;mode='maintain';}
  else{target=Math.round((tdee-pace*7700/7)/10)*10;
    if(target<floor){target=Math.min(tdee,floor);warn.push('Your pace would drop below '+floor+' kcal a day, which is too low without medical advice. I raised your target to '+target+' kcal, so the loss will be slower.');}}
  const deficit=tdee-target,rate=deficit*7/7700;
  const weeks=rate>0.01?toLose/rate:Infinity;
  const hmin=Math.round(18.5*(h/100)**2),hmax=Math.round(22.9*(h/100)**2);
  if(tw/((h/100)**2)<18.5&&toLose>0)warn.push('Your target weight is in the underweight range. A healthy weight for your height is about '+hmin+' to '+hmax+' kg.');
  if(rate>w*0.01)warn.push('That pace is more than 1% of your body weight per week. Choose a gentler pace.');
  if(age<18)warn.push('This plan is built for adults. If you are under 18, please follow a doctor or dietitian instead.');
  const ref=(w+Math.min(w,Math.max(tw,w*0.8)))/2;
  const protein=Math.round(1.3*ref/5)*5;
  const fat=Math.round(0.27*target/9);
  const carbs=Math.max(0,Math.round((target-protein*4-fat*9)/4));
  const cat=bmi<18.5?'Underweight':bmi<23?'Healthy':bmi<25?'Overweight':'Obese';
  return{bmi:Math.round(bmi*10)/10,cat,bmr:Math.round(bmr),tdee,target,deficit,rate:Math.round(rate*100)/100,weeks,protein,fat,carbs,fibre:30,ideal:Math.round(21*(h/100)**2),w23:Math.round(23*(h/100)**2),w25:Math.round(25*(h/100)**2),hmin,hmax,toLose:Math.round(toLose*10)/10,mode,warn};
}

const TEMPL={3:['chesttri','backbi','legs'],4:['chesttri','backbi','legs','shcore'],5:['chesttri','backbi','legs','shcore','cardio'],6:['chesttri','backbi','legs','shcore','cardio','recovery']};
const SESS={chesttri:['push','push','push','tri','tri'],backbi:['pull','pull','pull','bi','bi'],legs:['squat','squat','hinge','hinge','calf'],shcore:['shoulder','shoulder','shoulder','core','core'],glutecore:['hinge','hinge','squat','core','core'],cardio:['cardio','cardio','cardio','core','cardio'],recovery:[]};
const SNAME={chesttri:'Chest and triceps',backbi:'Back and biceps',legs:'Legs and calves',shcore:'Shoulders and abs',glutecore:'Glutes and core',cardio:'Cardio and core circuit',recovery:'Active recovery'};
const SFOCUS={chesttri:'Chest, front shoulders, triceps. These muscles work together on every pressing move.',backbi:'Lats, upper back, rear shoulders, biceps. Your biceps help on every pull.',legs:'Quads, hamstrings, glutes and calves.',shcore:'Shoulders first, then abs to finish.',glutecore:'Glutes, hamstrings and abs.',cardio:'Heart and lungs, plus core.',recovery:'Gentle stretching and breathing to recover.'};
const MUSCLE={push:'Chest',pull:'Back',shoulder:'Shoulders',tri:'Triceps',bi:'Biceps',squat:'Quads',hinge:'Glutes and hamstrings',calf:'Calves',core:'Abs',cardio:'Cardio',stretch:'Stretch'};
const okEx=(e,W)=>(e.eq==='none'||(e.eq==='db'&&W.equip!=='none')||(e.eq==='gym'&&W.equip==='gym'))&&!(W.lowImpact&&(e.imp||e.knee));
const hash=s=>{let h=0;for(const ch of s)h=(h*31+ch.charCodeAt(0))%997;return h;};
function pickEx(pat,target,used,W,n){
  let c=Object.values(EX).filter(e=>e.pat===pat&&okEx(e,W)&&!used.has(e.id));
  if(W.equip==='gym'){const g=c.filter(e=>e.eq!=='none');if(g.length)c=g;}
  c.sort((a,b)=>Math.abs(a.lv-target)-Math.abs(b.lv-target)||((hash(a.id)+n)%7)-((hash(b.id)+n)%7));
  return c[0];
}
function presc(e,W){
  const fit={beginner:0,intermediate:1,advanced:2}[W.fit]||0;
  const sets=clamp([2,3,4][fit]+(W.setAdj||0),2,5),b=W.repBonus||0;
  if(e.t==='min')return{sets:1,amt:clamp(8+fit*2+b*2,8,30),u:'min'};
  if(e.t==='rounds')return{sets:1,amt:clamp(4+fit*2+b,4,12),u:'rounds'};
  if(e.t==='sec'){const base=e.pat==='cardio'?30:20;return{sets,amt:clamp(base+fit*8+b*5,15,60),u:'sec'};}
  const br={endo:14,meso:12,ecto:10}[W.body]||12;
  return{sets,amt:clamp(br-2+fit*2+b,6,22),u:'reps'};
}
function estSession(items,weight){
  let kc=0,min=0;
  for(const it of items){const e=EX[it.ex];let work,rest=0;
    if(it.u==='min')work=it.amt;else if(it.u==='rounds')work=it.amt;
    else if(it.u==='sec'){work=it.amt*it.sets/60;rest=(it.sets-1)*0.5;}
    else{work=it.sets*0.7;rest=it.sets*0.75;}
    min+=work+rest;kc+=weight*(work*e.met+rest*2.3)/60;}
  return{min:Math.round(min),kcal:Math.round(kc)};
}
function mkSession(type,k,W,weight){
  const items=[],used=new Set();
  const add=(id,part,over)=>{const e=EX[id],p=over||presc(e,W);items.push({ex:id,part,sets:p.sets,amt:p.amt,u:p.u,done:false});};
  if(type==='recovery'){
    add('sn','warm',{sets:1,amt:8,u:'rounds'});
    ['catcow','cobra','hipflex','child','hamstr'].forEach(id=>add(id,'main',{sets:1,amt:40,u:'sec'}));
  }else{
    if(W.equip==='gym'){add('tread','warm',{sets:1,amt:5,u:'min'});used.add('tread');}else{add('sn','warm',{sets:1,amt:3,u:'rounds'});used.add('sn');}
    for(const pat of SESS[type]){const e=pickEx(pat,clamp(W.lv[pat],0,5),used,W,k*3+items.length);if(!e)continue;used.add(e.id);add(e.id,'main');}
    if(W.body==='endo'&&type!=='cardio'){const e=pickEx('cardio',clamp(W.lv.cardio,0,5),used,W,k);if(e){used.add(e.id);add(e.id,'main');}}
    add('child','cool',{sets:1,amt:30,u:'sec'});add('hamstr','cool',{sets:1,amt:30,u:'sec'});
  }
  return Object.assign({rest:false,type,name:SNAME[type],focus:SFOCUS[type],items},estSession(items,weight));
}
function buildWorkout(W,weight){
  const n=W.days,map=DAYMAP[n],tpl=TEMPL[n].slice(),week=[];
  for(let i=0;i<7;i++)week.push({rest:true});
  map.forEach((di,k)=>{let t=tpl[k];if(W.body==='ecto'&&t==='cardio')t='glutecore';week[di]=mkSession(t,k,W,weight);});
  return week;
}
function initLv(fit){const v={beginner:1,intermediate:2.2,advanced:3.4}[fit]||1;return{push:v,pull:v,shoulder:v,tri:v,bi:v,squat:v,hinge:v,calf:v,core:v,cardio:v};}
function adaptW(W,rating,pain){
  for(const k in W.lv){
    if(rating==='easy')W.lv[k]=Math.min(5,W.lv[k]+1);
    else if(rating==='right')W.lv[k]=Math.min(5,W.lv[k]+0.4);
    else W.lv[k]=Math.max(0,W.lv[k]-0.8);
  }
  if(rating==='easy'){W.repBonus=0;W.setAdj=Math.min(1,(W.setAdj||0)+1);}
  else if(rating==='right'){W.repBonus=Math.min(4,(W.repBonus||0)+1);}
  else{W.repBonus=Math.max(0,(W.repBonus||0)-2);W.setAdj=-1;}
  if(pain)W.lowImpact=true;
}

  const dl=DL(k),qs=quests(k),got=qs.filter(q=>q.done).length;
  let h='<section class="card"><div class="row sp"><h2>Today’s quests</h2><span class="pill">'+got+' of 5</span></div>';
  for(const q of qs){
    let ctl='<span class="qc">'+(q.done?ic('check'):'')+'</span>';
    if(q.manual&&!q.done)ctl='<button class="qc" data-a="walk" aria-label="Mark walk done"></button>';
    h+='<div class="q'+(q.done?' done':'')+'">'+ctl+'<div class="qt">'+q.label+(q.sub&&!q.done?' <small>'+q.sub+'</small>':'')+'</div><span class="xp">+'+q.xp+'</span></div>';

function slotBlock(s,n,k,dl){

function wChart(){
  const ws=S.weights;if(ws.length<2)return '<p class="note">Log your weight weekly to see the trend here.</p>';
  const tw=+S.profile.tw,vals=ws.map(x=>x.kg).concat([tw]),mn=Math.min(...vals)-1,mx=Math.max(...vals)+1;
  const W=320,H=130,L=34,R=10,Tp=10,B=22;
  const x=i=>L+(W-L-R)*(ws.length===1?0:i/(ws.length-1)),y=v=>Tp+(H-Tp-B)*(1-(v-mn)/(mx-mn));

}

const MEAS=[
 ['neck','Neck','Just below the Adam\u2019s apple, at the narrowest point',20,70],
 ['shoulder','Shoulders','Around the widest part of your shoulders, arms relaxed',70,200],
 ['chest','Chest','Under the armpits across the chest, breathing normally',50,220],
 ['arm','Upper arm','Relaxed, halfway between shoulder and elbow. Use the same arm every time',15,70],
 ['waist','Waist','Around your belly button, relaxed, after breathing out',40,250],
 ['hip','Hips','Around the widest part of your hips and buttocks',50,250],
 ['thigh','Thigh','Halfway between hip crease and knee, standing',25,120],
 ['calf','Calf','Around the widest part of your calf',15,70]
];
function lastOf(k){for(let i=S.meas.length-1;i>=0;i--){const v=S.meas[i].v[k];if(v!=null)return v;}return null;}
function firstOf(k){for(const e of S.meas){if(e.v[k]!=null)return e.v[k];}return null;}
function seriesOf(k){return S.meas.filter(e=>e.v[k]!=null).map(e=>({d:e.d,val:e.v[k]}));}
function navyFat(){
  const p=S.profile,n=lastOf('neck'),w=lastOf('waist'),hp=lastOf('hip'),h=+p.h;let r=null;
  if(n==null||w==null||w<=n)return null;
  if(p.sex==='m')r=495/(1.0324-0.19077*Math.log10(w-n)+0.15456*Math.log10(h))-450;
  else if(hp!=null)r=495/(1.29579-0.35004*Math.log10(w+hp-n)+0.221*Math.log10(h))-450;
  return(r==null||r<2||r>60)?null:Math.round(r*10)/10;
}
function measCard(){
  const have=MEAS.filter(m=>lastOf(m[0])!=null);
  let h='<section class="card"><div class="row sp"><h2>Body measurements</h2><button class="btn sm" data-a="meassheet">Log</button></div>';
  if(!have.length)return h+'<p class="note" style="margin-top:8px">Measure with a soft tape, in the morning, relaxed. Log every 1 to 2 weeks. Your body often shrinks before the scale moves.</p></section>';
  h+='<div class="col" style="margin-top:10px;gap:6px">';
  for(const m of have){const l=lastOf(m[0]),f=firstOf(m[0]),d=Math.round((l-f)*10)/10;h+='<div class="row sp"><span>'+m[1]+'</span><span><b>'+l+' cm</b> <small>'+(d===0?'start':(d>0?'+':'')+d+' cm')+'</small></span></div>';}
  h+='</div>';
  const w=lastOf('waist');
  if(w!=null){const r=w/(+S.profile.h),lab=r<0.5?'Healthy':r<0.6?'Raised':'High';h+='<p style="margin-top:10px"><b>Waist-to-height ratio: '+r.toFixed(2)+'</b> <span class="pill'+(r>=0.6?' warn':'')+'">'+lab+'</span><br><small>Aim for below 0.5. It is a better health marker than BMI alone.</small></p>';}
  const bf=navyFat();
  if(bf!=null)h+='<p style="margin-top:8px"><b>Estimated body fat: '+bf+'%</b><br><small>US Navy tape method. It can be off by 3 to 4 points, so watch the trend, not the number.</small></p>';

  h+='<div class="row wrap" style="margin:12px 0 6px;gap:6px">'+have.map(m=>'<button class="chip'+(m[0]===mk?' on':'')+'" data-a="mkey" data-k="'+m[0]+'">'+m[1]+'</button>').join('')+'</div>'+lineChart(seriesOf(mk),'val');
  return h+'</section>';
}
function bmiCat(b){return b<18.5?'Underweight':b<23?'Healthy':b<25?'Overweight':'Obese';}
function bmiScale(b){
  const W=320,L=14,bw=W-2*L,mn=15,mx=42,X=v=>L+bw*(clamp(v,mn,mx)-mn)/(mx-mn);
  const segs=[[15,18.5,'--cyan'],[18.5,23,'--accent'],[23,25,'--gold'],[25,42,'--chili']];
  let s='<svg viewBox="0 0 '+W+' 64" width="100%" role="img" aria-label="BMI scale. Your BMI is '+b.toFixed(1)+'"><defs><clipPath id="bmiclip"><rect x="'+L+'" y="27" width="'+bw+'" height="14" rx="7"/></clipPath></defs><g clip-path="url(#bmiclip)">';
  segs.forEach(g=>{s+='<rect x="'+X(g[0]).toFixed(1)+'" y="27" width="'+(X(g[1])-X(g[0])+0.5).toFixed(1)+'" height="14" style="fill:var('+g[2]+')"/>';});
  s+='</g><rect x="'+L+'" y="27" width="'+bw+'" height="14" rx="7" style="fill:none;stroke:var(--edge)" stroke-width="2.5"/>';
  [18.5,23,25].forEach(v=>{s+='<text x="'+X(v).toFixed(1)+'" y="57" text-anchor="middle" font-size="10" style="fill:var(--muted)">'+v+'</text>';});
  const x=X(b),anc=x>W-52?'end':x<52?'start':'middle',tx=anc==='end'?x+8:anc==='start'?x-8:x;
  s+='<polygon points="'+(x-6).toFixed(1)+',15 '+(x+6).toFixed(1)+',15 '+x.toFixed(1)+',26" style="fill:var(--pop);stroke:var(--edge)" stroke-width="2" stroke-linejoin="round"/><text x="'+tx.toFixed(1)+'" y="10" text-anchor="'+anc+'" font-size="12" font-weight="700" style="fill:var(--ink)">You '+b.toFixed(1)+'</text></svg>';
  return s;
}
function idealCard(t){
  const p=S.profile,h2=Math.pow(p.h/100,2),now=weightNow(),bmi=now/h2,cat=bmiCat(bmi),hm=t.hmin,hx=t.hmax,tw=+p.tw,gb=tw/h2;
  let msg;
  if(now>hx)msg='To reach the healthy range, lose about <b>'+(Math.round((now-hx)*10)/10)+' kg</b>, down to '+hx+' kg.';

  else msg='You are inside the healthy range. Keep your weight steady.';
  let gm;
  if(gb<18.5)gm='Your goal of '+tw+' kg is below the healthy range. Consider a higher goal.';
  else if(gb<23)gm='Your goal of '+tw+' kg is inside the healthy range.';
  else gm='Your goal of '+tw+' kg is BMI '+gb.toFixed(1)+' ('+bmiCat(gb)+'). That is a good first milestone, and you can aim lower once you reach it.';
  const rows=[['Underweight','Below '+hm+' kg','--cyan'],['Healthy',hm+' to '+hx+' kg','--accent'],['Overweight',hx+' to '+t.w25+' kg','--gold'],['Obese',t.w25+' kg and above','--chili']];
  let h='<section class="card"><h2>Ideal weight and BMI</h2><p class="muted" style="margin:4px 0 8px">At '+p.h+' cm, a healthy weight is <b>'+hm+' to '+hx+' kg</b> (BMI 18.5 to 22.9). Your ideal is about <b>'+t.ideal+' kg</b>, the middle of that range.</p>'+bmiScale(bmi)+'<div style="margin-top:6px">';
  for(const r of rows)h+='<div class="band"><i style="background:var('+r[2]+')"></i><span style="flex:1;font-weight:'+(r[0]===cat?'800':'500')+'">'+r[0]+'</span><span>'+r[1]+'</span>'+(r[0]===cat?'<span class="pill">You</span>':'')+'</div>';
  return h+'</div><p style="margin-top:10px">'+msg+'</p><p class="note" style="margin-top:6px">'+gm+'</p><p class="note" style="margin-top:6px">These are the Asian BMI ranges used for Indians. BMI cannot tell muscle from fat, so also watch your waist-to-height ratio under Body measurements.</p></section>';
}

function validStep(){

function foodRes(q){

  if(!q)list.sort((a,b)=>((b.custom?1:0)-(a.custom?1:0))||((b.g?1:0)-(a.g?1:0))||((a.cheat?1:0)-(b.cheat?1:0)));
  list=list.slice(0,q?80:60);
  if(!list.length)return '<p class="note">Nothing found. Add it as a custom food.</p>';
  return list.map(f=>'<button class="frow" data-a="pickfood" data-id="'+f.id+'"><span><b>'+f.name+'</b><span class="gu">'+f.gu+'</span><small>'+f.serv+'</small></span><em>'+f.k+' kcal</em></button>').join('');
}

  return '';

function finishOnb(){
  const f=V.form,p=Object.assign({},f,{age:+f.age,h:+f.h,w:+f.w,tw:+f.tw,pace:+f.pace,days:+f.days});
  if(V.editing&&S){
    const wChanged=Math.abs(p.w-weightNow())>0.01;
    S.profile=p;if(wChanged)S.weights.push({d:todayK(),kg:p.w});
    Object.assign(S.W,{days:p.days,fit:p.fit,body:p.body,equip:p.equip});
    if(p.joint)S.W.lowImpact=true;rebuildWeek();ensurePlans();
  }else{createState(p);}
  V.form=null;V.editing=false;V.onb=0;V.tab='today';saveS();render();window.scrollTo(0,0);
}
function onClick(e){
  const el=e.target.closest('[data-a]');if(!el)return;
  const a=el.dataset.a,d=el.dataset;
  switch(a){
    case 'pick':{if(d.k==='cirate'){V.sheet.rate=d.v;render();return;}const v=d.v;V.form[d.k]=(d.k==='pace')?+v:(d.k==='days'?+v:v);render();return;}
    case 'flip':V.form[d.k]=!V.form[d.k];render();return;
    case 'onnext':{V.err=validStep();if(V.err){render();return;}if(V.onb<4){V.onb++;render();window.scrollTo(0,0);}else finishOnb();return;}
    case 'onback':V.err='';V.onb=Math.max(0,V.onb-1);render();window.scrollTo(0,0);return;
    case 'oncancel':V.form=null;V.editing=false;V.onb=0;V.err='';render();return;
    case 'tab':V.tab=d.t;V.sheet=null;V.resetAsk=false;render();window.scrollTo(0,0);return;
    case 'closesheet':V.sheet=null;render();return;
    case 'day':V.day=+d.i;render();return;
    case 'tday':V.tday=+d.i;render();return;
    case 'pref':S.profile[d.k]=d.v;ensurePlans();saveS();render();return;
    case 'prefb':S.profile[d.k]=!S.profile[d.k];ensurePlans();saveS();render();return;
    case 'reroll':S.seed=Math.floor(Math.random()*1e9);ensurePlans();saveS();render();toast('New week plan ready');return;
    case 'swapmeal':V.sheet={type:'planswap',i:+d.i,slot:d.s};render();return;
    case 'pickopt':{swapOpt(S.mp.days[V.sheet.i],V.sheet.slot,d.id);V.sheet=null;saveS();render();return;}
    case 'logplan':{const k=todayK(),x=S.mp.days[+d.i].slots[d.s];if(DL(k).items.some(i=>i.slot===d.s)){toast('That meal already has food logged');return;}for(const it of x.items)addItem(k,d.s,it[0],it[1]);commit();return;}
    case 'addfood':V.sheet={type:'food',slot:d.s,sel:null,qty:1};render();return;
    case 'pickfood':V.sheet.sel=d.id;V.sheet.qty=1;render();return;
    case 'unpick':V.sheet.sel=null;render();return;
    case 'qty':{V.sheet.qty=Math.max(0.5,Math.round((V.sheet.qty+(+d.d)*0.5)*100)/100);render();return;}
    case 'qset':V.sheet.qty=+d.v;render();return;
    case 'editqty':{const it=DL(todayK()).items.find(x=>x.id===d.id);if(!it)return;V.sheet={type:'editqty',id:it.id,name:it.n,sv:it.sv,qty:it.q,u:{k:it.k/it.q,p:it.p/it.q,c:it.c/it.q,f:it.fa/it.q,fi:(it.fi||0)/it.q}};render();return;}
    case 'saveqty':{const sh=V.sheet,it=DL(todayK()).items.find(x=>x.id===sh.id);if(it&&sh.qty>0){it.q=sh.qty;it.k=Math.round(sh.u.k*sh.qty);it.p=+(sh.u.p*sh.qty).toFixed(1);it.c=+(sh.u.c*sh.qty).toFixed(1);it.fa=+(sh.u.f*sh.qty).toFixed(1);it.fi=+((sh.u.fi||0)*sh.qty).toFixed(1);}V.sheet=null;commit();toast('Amount updated');return;}
    case 'confirmfood':{addItem(todayK(),V.sheet.slot,V.sheet.sel,V.sheet.qty);V.sheet=null;commit();return;}
    case 'customsheet':V.sheet={type:'custom',slot:V.sheet.slot};render();return;
    case 'saveccustom':{
      const n=$('#cn').value.trim(),sv=($('#cs').value||'').trim()||'1 serving',p=+$('#cp').value||0,c=+$('#cc').value||0,f=+$('#cf').value||0,fi=+($('#cfi')?$('#cfi').value:0)||0;let k=+$('#ck').value||0;
      if(!n){$('#cerr').textContent='Enter a name for the food.';return;}
      if(p<0||c<0||f<0||k<0||fi<0){$('#cerr').textContent='Values cannot be negative.';return;}
      if(!k)k=Math.round(4*p+4*c+9*f);
      if(!(k>0)){$('#cerr').textContent='Enter the calories, or at least one of protein, carbs or fat.';return;}
      if(k>3000||p>300||c>600||f>300||fi>100){$('#cerr').textContent='That looks too large for one serving. Check the numbers.';return;}
      if(!S.custom)S.custom=[];
      const cf={id:'c_'+uid(),name:n,serv:sv,p,c,f,fi,k};S.custom.push(cf);regCustom(cf);
      V.sheet={type:'food',slot:V.sheet.slot,sel:cf.id,qty:1};saveS();render();return;}
    case 'delcustom':{const id=V.sheet.sel;S.custom=(S.custom||[]).filter(x=>x.id!==id);delete FD[id];V.sheet.sel=null;saveS();render();toast('Food deleted');return;}
    case 'delitem':{const dl=DL(todayK());dl.items=dl.items.filter(i=>i.id!==d.id);saveS();render();return;}
    case 'water':{const dl=DL(todayK()),n=+d.n;dl.water=dl.water===n?n-1:n;commit();return;}
    case 'walk':DL(todayK()).walk=true;commit();return;
    case 'closeday':{const dl=DL(todayK());if(closeOK(dl)&&!dl.q.close){dl.q.close=1;addXP(30,'Day closed');}commit();return;}
    case 'cheatsheet':V.sheet={type:'cheat'};render();return;
    case 'cheatday':S.cheat.day=+d.i;ensurePlans();saveS();render();return;
    case 'setcheat':S.cheat.id=d.id;if(S.cheat.day<0)S.cheat.day=6;ensurePlans();saveS();V.sheet=null;V.day=S.cheat.day;render();return;
    case 'nocheat':S.cheat.day=-1;ensurePlans();saveS();V.sheet=null;render();return;
    case 'exdone':{const it=S.W.week[+d.d].items[+d.i];it.done=!it.done;
      if(it.done&&!it.xpd){it.xpd=1;addXP(3,EX[it.ex].name);}
      const k=dkey(new Date(pkey(S.W.start).getTime()+(+d.d)*864e5+36e5));
      if(k===todayK())awardQuests();saveS();render();return;}
    case 'swapex':V.sheet={type:'exswap',d:+d.d,i:+d.i};render();return;
    case 'pickex':{
      const it=S.W.week[V.sheet.d].items[V.sheet.i],old=EX[it.ex],ne=EX[d.id],pr=presc(ne,S.W);
      Object.assign(it,{ex:ne.id,sets:pr.sets,amt:pr.amt,u:pr.u,done:false});
      if(ne.lv<old.lv)S.W.lv[ne.pat]=Math.min(S.W.lv[ne.pat],ne.lv);else if(ne.lv>old.lv)S.W.lv[ne.pat]=Math.max(S.W.lv[ne.pat],ne.lv);
      S.stats.swaps++;V.sheet=null;toast('Swapped to '+ne.name);commit();return;}
    case 'lowimpact':S.W.lowImpact=!S.W.lowImpact;rebuildWeek();saveS();render();return;
    case 'endweek':case 'checkin':V.sheet={type:'checkin',rate:null,pain:false,err:''};render();return;
    case 'cirate':V.sheet.rate=d.v;render();return;
    case 'ciflip':V.sheet.pain=!V.sheet.pain;render();return;
    case 'cisubmit':{
      const sh=V.sheet;if(!sh.rate){sh.err='Choose how the week felt.';render();return;}
      const kg=+$('#ciw').value;if(!(kg>=30&&kg<=250)){sh.err='Enter your weight in kg.';render();return;}
      const sess=S.W.week.filter(x=>!x.rest),done=sess.filter(x=>x.items.filter(i=>i.part==='main').every(i=>i.done)).length;
      let msg='Week '+(S.W.num+1)+' is ready';
      adaptW(S.W,sh.rate,sh.pain);
      if(done<sess.length/2&&S.W.days>3){S.W.days--;msg+=', with one fewer session';}
      if(done===sess.length&&sess.length>0)S.stats.iron++;
      S.W.hist.push({week:S.W.num,done,total:sess.length,rate:sh.rate});
      if(Math.abs(kg-weightNow())>0.01||S.weights[S.weights.length-1].d!==todayK())S.weights.push({d:todayK(),kg});
      S.W.num++;S.W.start=monK(todayK());S.W.pending=false;S.stats.checkins++;addXP(50,'Weekly check-in');
      rebuildWeek();V.tday=null;V.sheet=null;commit();toast(msg);return;}
    case 'weightsheet':V.sheet={type:'weight'};render();return;
    case 'saveweight':{const kg=+$('#nw').value;if(!(kg>=30&&kg<=250))return;S.weights.push({d:todayK(),kg});V.sheet=null;commit();return;}
    case 'meassheet':V.sheet={type:'meas'};render();return;
    case 'mkey':V.mk=d.k;render();return;
    case 'savemeas':{
      const vals={};let any=false;
      for(const m of MEAS){const raw=$('#m_'+m[0]).value;if(raw===''||raw==null)continue;const n=+raw;
        if(!(n>=m[3]&&n<=m[4])){$('#merr').textContent=m[1]+' should be between '+m[3]+' and '+m[4]+' cm.';return;}
        vals[m[0]]=n;any=true;}
      if(!any){$('#merr').textContent='Enter at least one measurement.';return;}
      const t=todayK();let e=S.meas.find(x=>x.d===t);if(e)Object.assign(e.v,vals);else S.meas.push({d:t,v:vals});
      V.sheet=null;commit();toast('Measurements saved');return;}
    case 'editprofile':V.form=Object.assign({},S.profile);V.editing=true;V.onb=0;render();window.scrollTo(0,0);return;
    case 'reset':{if(!V.resetAsk){V.resetAsk=true;render();return;}try{localStorage.removeItem(KEY);}catch(x){}S=null;V.form=blankForm();V.editing=false;V.onb=0;V.resetAsk=false;V.tab='today';render();window.scrollTo(0,0);return;}
  }
}
function onInput(e){
  const t=e.target;
  if(t.dataset&&t.dataset.f&&V.form){V.form[t.dataset.f]=t.value;return;}
  if(t.id==='fq'){$('#fres').innerHTML=foodRes(t.value);}
  if(t.id==='qin'&&V.sheet){const q=Math.round(+t.value*100)/100;if(q>0&&q<=50){V.sheet.qty=q;const uu=V.sheet.type==='editqty'?V.sheet.u:FD[V.sheet.sel];$('#qnum').textContent=fmtQ(q);$('#qsum').innerHTML=qsum(uu,q);}}
}
function onChange(e){
  const t=e.target;if(!S)return;
  if(t.id==='s_days'||t.id==='s_equip'||t.id==='s_body'){
    S.W.days=+$('#s_days').value;S.W.equip=$('#s_equip').value;S.W.body=$('#s_body').value;
    S.profile.days=S.W.days;S.profile.equip=S.W.equip;S.profile.body=S.W.body;
    rebuildWeek();saveS();render();toast('Week rebuilt');
  }
}
document.addEventListener('click',onClick);
document.addEventListener('input',onInput);
document.addEventListener('change',onChange);
// ---------- boot ----------
(function boot(){
  S=loadS();
  if(S&&S.custom)S.custom.forEach(regCustom);
  if(!S){V.form=blankForm();}
  else{try{finalizePast();ensurePlans();awardQuests();saveS();}catch(err){console.error(err);}}
  render();
})();

if('serviceWorker' in navigator){window.addEventListener('load',function(){navigator.serviceWorker.register('sw.js').catch(function(){});});}
</script></body></html>
